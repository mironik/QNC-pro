[package]
name = "qnc-timeline-panel"
version.workspace = true
edition.workspace = true
description = "Draws a timeline window (wave lanes, marks, playhead, the part outside the marks dimmed) and gives back the mouse gestures on it; the one painter of the source timeline and its zoom."

