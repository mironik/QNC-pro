[package]
name = "qnc-project-settings-panel"
version.workspace = true
edition.workspace = true
description = "The settings panel of the Project board as the old form drew it: title and subtitle, WORKFLOW with the template picker, New project; it draws what the projects module holds and returns actions."

[dependencies]
