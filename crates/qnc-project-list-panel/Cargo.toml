[package]
name = "qnc-project-list-panel"
version.workspace = true
edition.workspace = true
description = "Draws the project list of the Project board (title with search, one row per project with its date and x, the status line) from the session and returns the intents the user asked."

[dependencies]
eframe = { workspace = true }
qnc-desktop-theme = { path = "../qnc-desktop-theme" }
qnc-text = { path = "../qnc-text" }
qnc-settings-rows = { path = "../qnc-settings-rows" }
qnc-project-layout = { path = "../qnc-project-layout" }
qnc-project-application = { path = "../qnc-project-application" }
qnc-project-session = { path = "../qnc-project-session" }
