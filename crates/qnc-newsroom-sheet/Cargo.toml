[package]
name = "qnc-newsroom-sheet"
version.workspace = true
edition.workspace = true
description = "QNC public piece: the story sheet (the data of a news story as fields by code): the prepared sheets and the ones a newsroom makes, the overlay that fills one (project name first, fields one under the other) and the editor of a sheet with its lock"

[dependencies]
qnc-newsroom-sheet-model = { path = "../qnc-newsroom-sheet-model" }
eframe = { workspace = true }
qnc-desktop-theme = { path = "../qnc-desktop-theme" }
qnc-field-spec = { path = "../qnc-field-spec" }
qnc-key-row = { path = "../qnc-key-row" }
qnc-settings-form = { path = "../qnc-settings-form" }
qnc-ui-kit = { path = "../qnc-ui-kit" }
qnc-actions = { path = "../qnc-actions" }
qnc-text = { path = "../qnc-text" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
