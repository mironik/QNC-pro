[package]
name = "qnc-autoplay-guard"
version.workspace = true
edition.workspace = true
description = "While it runs, answers the system's AutoPlay question for the disks the caller names, so no File Explorer opens for a card the tray takes; no system setting is changed."

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
