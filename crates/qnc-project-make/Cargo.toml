[package]
name = "qnc-project-make"
version.workspace = true
edition.workspace = true
description = "A new project as the old QNC made it: template and chosen applications into settings, origin, folders, project.db with settings, catalog and workspace, protection, then the registry row that makes it active."

[dependencies]
serde_json = { workspace = true }
qnc-db = { path = "../qnc-db" }
qnc-ids = { path = "../qnc-ids" }
qnc-uri = { path = "../qnc-uri" }
qnc-registry = { path = "../qnc-registry" }
qnc-project-templates = { path = "../qnc-project-templates" }
qnc-project-settings = { path = "../qnc-project-settings" }
qnc-project-workspace = { path = "../qnc-project-workspace" }
qnc-catalog = { path = "../qnc-catalog" }
qnc-project-defaults = { path = "../qnc-project-defaults" }
qnc-folder-lock = { path = "../qnc-folder-lock" }
qnc-workstation-identity = { path = "../qnc-workstation-identity" }
qnc-diagnostics = { path = "../qnc-diagnostics" }
qnc-text = { path = "../qnc-text" }
