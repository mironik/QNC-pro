[package]
name = "qnc-application-catalog"
version.workspace = true
edition.workspace = true
description = "The catalog of the QNC applications of this computer (a file of data) and the selection snapshot a template or project keeps: read, validated, one application per priority group."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
qnc-uri = { path = "../qnc-uri" }
qnc-settings = { path = "../qnc-settings" }

[dev-dependencies]
tempfile = "3"
