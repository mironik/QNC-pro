[package]
name = "qnc-project-panel"
version.workspace = true
edition.workspace = true
description = "The Project panel: the list of projects with the active one, a new project from a template, Open and Delete with its question; it draws what it is given and returns the catalog's actions."

[dependencies]
egui = { workspace = true }
qnc-theme = { path = "../qnc-theme" }
qnc-text = { path = "../qnc-text" }
qnc-ui-kit = { path = "../qnc-ui-kit" }
qnc-actions = { path = "../qnc-actions" }
qnc-projects = { path = "../qnc-projects" }
