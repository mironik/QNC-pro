[workspace]
resolver = "2"
members = ["apps/*", "crates/*", "tools/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

# QNC-pro stands on its own: no path dependency on QNC-shared or QNC-AI. A block comes in only
# once it passes the admission list of AGENTS.md section 4, and from then on it is this repo's.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = "0.31"
eframe = "0.31"
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
memmap2 = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Devices", "Win32_Devices_DeviceAndDriverInstallation", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
libc = "0.2"
xml-rs = "0.8.29"
